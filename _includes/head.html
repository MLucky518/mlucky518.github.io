<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} | {{ site.title }}</title>
<link rel="icon" type="image/png" href="{{ '/assets/images/logo-light.png' | relative_url }}">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600&family=Press+Start+2P&display=swap"
    rel="stylesheet">

<!-- CSS -->
<link rel="stylesheet" href="{{ '/assets/css/global.css' | relative_url }}">
{% if page.layout == 'landing' %}
<link rel="stylesheet" href="{{ '/assets/css/landing.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/pixel-elements.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/pixel-character.css' | relative_url }}">
{% elsif page.layout == 'blog' or page.layout == 'post' %}
<link rel="stylesheet" href="{{ '/assets/css/blog.css' | relative_url }}">
{% endif %}
